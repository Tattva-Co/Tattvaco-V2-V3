name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tattva_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tattva_ci
      TATTVA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tattva_ci_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Migration round-trip (upgrade → downgrade base → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"

      - name: Checkpoint schema setup
        run: python -m packages.workflows.checkpointer

      - name: Tests
        run: python -m pytest -p no:cacheprovider

      - name: Mypy (report only until burn-down completes; see docs/audit/09)
        continue-on-error: true
        run: mypy packages apps
