name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tattva_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tattva_ci
      TATTVA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tattva_ci_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Migration round-trip (upgrade → downgrade base → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"

      - name: Checkpoint schema setup
        run: python -m packages.workflows.checkpointer

      - name: Tests
        run: python -m pytest -p no:cacheprovider

      - name: Mypy (report only until burn-down completes; see docs/audit/09)
        continue-on-error: true
        run: mypy packages apps

  frontend:
    name: Frontend (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Playwright E2E against a live API + Postgres is not wired into CI yet (it needs a
      # running backend service alongside the dev server); see docs/audit/10, DEC-031.
      # `npm run e2e` is runnable locally with the stack from docker compose.

  docker-build:
    name: Docker images build (C9)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t tattva-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t tattva-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t tattva-web:ci apps/web

      # Not a full `docker compose up` (that needs the Postgres service container this
      # job doesn't have): building all three images is still real, useful CI coverage --
      # it catches a broken Dockerfile or a file the build forgot to COPY before anyone
      # tries to run the real stack.
