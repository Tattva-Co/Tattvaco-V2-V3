# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = packages/persistence/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path configuration
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# Version locations
version_locations = packages/persistence/migrations/versions

# Database URL
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:55432/tattva_film_director

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
