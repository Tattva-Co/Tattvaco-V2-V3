# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = packages/persistence/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path configuration
prepend_sys_path = .
path_separator = os

# Timezone for revision timestamps
timezone = UTC

# Version locations
version_locations = packages/persistence/migrations/versions

# Database URL: not set here. migrations/env.py takes it from application settings
# (DATABASE_URL env var / .env), so credentials never live in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
