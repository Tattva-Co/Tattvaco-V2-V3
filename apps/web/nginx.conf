server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.ts's dev-server proxy, so the built app needs no
    # environment-specific base URL: it always calls same-origin /api/..., and whichever
    # server is in front (Vite in dev, this nginx in docker-compose/production) forwards
    # it to the real API.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing: any path not matched above falls back to
    # index.html, which then resolves the route in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
