        completion_rule: Project details are valid and an owner is assigned.
        required: true
        na: never
        release: v1
        applicability: {modes: all}
        act_capability: project.admin
        approval_capability: null
        completion_check: {kind: manual_with_evidence}
        studio_tools: [S-GLB-02, S-PRJ-01, S-PRJ-02]
        requirements: [TFD-PRJ-001, TFD-PRJ-002]

      - id: JRN-01.2
        title: Production format
        purpose: >-
          Feature film, OTT series, short, trailer, documentary, vertical film or branded
          content; configure episode/season structure where applicable.
        completion_rule: A production format and required structure are selected.
        required: true
        na: never
        release: v1
        applicability: {modes: all}
        act_capability: project.admin
        approval_capability: null
        completion_check: {kind: manual_with_evidence}
        studio_tools: [S-GLB-02, S-PRJ-02]
        requirements: [TFD-FMT-001, TFD-FMT-003, TFD-FMT-004, TFD-FMT-005]

      - id: JRN-01.3
        title: Production mode
        purpose: >-
          Three-way choice: Fully AI, Hybrid Live-Action + AI, or Mixed. Allow overrides at
          sequence, scene and shot level.
        completion_rule: A project default is selected; mixed projects can override lower in the hierarchy.
        required: true
        na: never
        release: v1
        applicability: {modes: all}
        act_capability: project.admin
        approval_capability: null
        completion_check: {kind: manual_with_evidence}
        studio_tools: [S-GLB-02, S-MTH-01]
        requirements: [TFD-PRJ-003, TFD-PRJ-004, TFD-PRJ-005, TFD-PRJ-006]

      - id: JRN-01.4
        title: Creative governance
        purpose: >-
          Define management authority, locked screenplay policy, director revision rights
          and approval rules.
        completion_rule: Approval authority and script-governance policy are configured.
        required: true
        na: never
        release: v1
        applicability: {modes: all}
        act_capability: project.admin
        approval_capability: null
        completion_check: {kind: manual_with_evidence}
        studio_tools: [S-TEAM-02, S-PRJ-02]
        requirements: [TFD-IAM-005, TFD-SCR-002, TFD-APR-007]

