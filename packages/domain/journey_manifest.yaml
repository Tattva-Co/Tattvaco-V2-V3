        studio_tools: [S-CON-01]
        requirements: [TFD-CON-002, TFD-CON-003, TFD-CON-004]

      - id: JRN-07.7
        title: Production readiness
        purpose: >-
          Check screenplay version, assets, character/visual bible, shot specs, dependencies,
