        requirements: [TFD-SHT-002, TFD-PRJ-004, TFD-PRJ-005]

      - id: JRN-07.4
        title: On-set capture plan
        purpose: >-
          For hybrid shots, specify camera/lens, lighting, chroma, tracking, clean plates,
          performer references and capture manifest.
        completion_rule: Capture requirements are prepared or independent footage ingestion is selected.
        required: true
        na: reason_required
        # Plan D7: capture plan record is a V1 manual form; WF-12 automation is V2.
        release: v1_v2
