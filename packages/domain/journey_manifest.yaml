        required: true
        na: reason_required
        release: v1
        applicability: {modes: all}
        act_capability: project.admin
        approval_capability: null
        completion_check: {kind: manual_with_evidence}
        studio_tools: [S-TEAM-02, S-TEAM-01]
        requirements: [TFD-IAM-002, TFD-IAM-003, TFD-IAM-004, TFD-IAM-008]

