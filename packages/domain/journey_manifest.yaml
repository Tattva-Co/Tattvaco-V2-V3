# Tattva AI Film Director: Guided Workspace journey manifest.
#
# Machine-readable source of truth for the 10-section guided production journey.
# Spec and rules: docs/product/JOURNEY_MANIFEST.md (TFD-PRD-JRN-001).
# UX sources: docs/product/ux/guided-workspace-v1.0/
#   - Tattva_AI_Film_Director_UX_Strategy_Guided_Workspace_v1.0.md (sections 5-7, 10-11, 16)
#   - Tattva_AI_Film_Director_Guided_Workspace_Wireframe_v1.1.html (the `stages` data, the
#     subpoint template and the section-gating behaviour)
#
# Identity rules (DEC-011):
#   - Group IDs (JRN-<section>.<group>) and subpoint IDs (JRN-<section>.<group>.<item>) are
#     permanent. They never change when items are reordered, renamed or retired.
#   - Visible numbering (01, 01.1, 01.1.1) is derived from list order at render time.
#   - Retire an item by setting `retired: true`. Never delete it and never reuse its ID.
#
# Validated by tests/unit/test_journey_manifest.py.

manifest_version: 1

enums:
  production_modes: [fully_ai, hybrid_live_action, mixed]
  # v1 = FD-V1; v1_v2 = introduced in FD-V1 and expanded in FD-V2; v2 = FD-V2 only.
  releases: [v1, v1_v2, v2]
  # UX section 6 status model. `stale` implements step 10 (upstream change).
  item_statuses:
    - not_started
    - in_progress
    - review_required
    - changes_required
    - blocked
    - completed
    - not_applicable
    - stale
  section_statuses: [not_started, in_progress, blocked, ready_to_continue, completed]
  # `never`: the item can't be marked not applicable.
  # `reason_required`: marking it not applicable needs a recorded reason (UX section 6, step 5).
  na_policies: [never, reason_required]
  completion_check_kinds: [manual_with_evidence, system]

gating:
  # Wireframe v1.1 `isUnlocked`: a section opens when the previous section has no remaining
  # required items. Earlier sections stay revisitable, and reopening keeps history (UX 6.9).
  section_unlock: previous_section_ready
  revisit_completed_sections: true
  # Studio Tools are reachable directly (permission-aware), but opening a tool never completes
  # a step and never bypasses a gate (wireframe v1.1, Studio Tools Index text).
  studio_tools_complete_steps: false
  # UX 6.8: the server never moves the user to the next section unprompted.
  auto_advance: false

# Wireframe v1.1 accordion body: every group has the same two subpoints. Subpoint IDs are
# <group id>.<suffix>. A group needing other subpoints lists them explicitly with new IDs.
subpoint_template:
  - suffix: 1
    key: prepare
    title: Review and prepare
    kind: work
    description: >-
      Confirm the relevant source material, responsible owner and required decisions.
  - suffix: 2
    key: validate
    title: Validate and approve
    kind: review_gate
    description: >-
      Check completeness, source/asset links, permissions and any approval requirement.
      Preserve prior versions and record exceptions. Complete only when the product
      workflow behind it has actually passed its checks.

# Applicability (UX section 6, step 1):
#   modes: [..] or "all"      production modes in which the group applies by default
#   unless_any: [conditions]  the group still applies when any condition is true
#   Supported conditions are listed in JOURNEY_MANIFEST.md section 5.
# release: groups whose release is not shipped yet are absent, not shown as teasers (IA 4.2 r4).

sections:
