        approval_capability: approval.creative
        completion_check: {kind: manual_with_evidence}
        studio_tools: [S-PRJ-01, S-AID-01, S-SHT-01]
        requirements: [TFD-AID-001, TFD-CON-001, TFD-CON-005, TFD-PRJ-007]

  - id: JRN-08
    title: AI Production & Tool Handoff
    release_label: V1 manual; V2 connected
    groups:
