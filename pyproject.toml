[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tattva-ai-film-director"
version = "0.1.0"
description = "Tattva AI Film Director - Greenfield Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Tattva Co. / Engineering Team" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "streamlit>=1.32.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["packages/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends()/File() defaults are idiomatic
    "S101",   # assert is fine in tests
    "UP007",  # keep Optional[...] where it reads better
    "UP006", "UP035",  # allow typing.List/Dict during gradual migration
    "UP042",  # StrEnum is Python 3.11+, keep str, Enum for broader compatibility
    "S104",   # 0.0.0.0 default host for containers
    "SIM102", # allow nested if statements where clearer
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"packages/persistence/migrations/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "tests"]
